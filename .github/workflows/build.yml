name: 构建并发布加载项镜像

# 推送涉及加载项目录的改动即重建；版本号取自 eastsun_console/config.yaml。
# 产物（双推送）：
#   - GHCR: ghcr.io/tsyf888/{arch}-eastsun_console_ha:<版本>（境外用户 / 默认）
#   - 阿里云 ACR: $ACR_REGISTRY/$ACR_NAMESPACE/{arch}-eastsun_console_ha:<版本>（国内用户）
# 国内用户侧仓库的 config.yaml 把 image 字段指向 ACR 即可，两边镜像内容一致。
on:
  push:
    branches: [main]
    paths:
      - 'eastsun_console/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: eastsun_console_ha
  # TODO: 改成你的阿里云 ACR 实例地域与命名空间（个人版免费）
  ACR_REGISTRY: crpi-0sb04gsigxiqd7ve.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: tsyf888

permissions:
  contents: read

jobs:
  init:
    name: 准备构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成架构矩阵
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
      - name: 读取加载项版本号
        id: version
        run: |
          v=$(grep -E '^version:' eastsun_console/config.yaml | head -1 | sed -E 's/^version:\s*"?([^"]+)"?\s*$/\1/')
          echo "version=${v}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 构建并推送 ${{ matrix.arch }} 镜像
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: eastsun_console
          image: ${{ matrix.image }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.20
          version: ${{ needs.init.outputs.version }}
          push: "true"
          cosign: "false"
      # 构建只跑一次：从 GHCR 拉取刚推好的镜像，换 tag 再推到 ACR，避免二次构建。
      - name: 同步镜像到阿里云 ACR
        env:
          GHCR_IMAGE: ghcr.io/${{ matrix.image }}
          ACR_IMAGE: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.arch }}-${{ env.IMAGE_NAME }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ env.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin
          for tag in "${{ needs.init.outputs.version }}" latest; do
            docker pull "$GHCR_IMAGE:$tag"
            docker tag "$GHCR_IMAGE:$tag" "$ACR_IMAGE:$tag"
            docker push "$ACR_IMAGE:$tag"
          done
